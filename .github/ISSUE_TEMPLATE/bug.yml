name: Bug report
description: Report a problem when running or testing the project.
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, Node/Python version, and relevant error. Remove tokens and private chat content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
